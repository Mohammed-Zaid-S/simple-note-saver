{% extends "base.html" %}

{% block title %}My Notes - Note Saver{% endblock %}

{% block content %}
<div class="container">
    <header>
        <h1>My Notes</h1>
        <a href="/newNote" class="btn primary-btn">+ Create New Note</a>
    </header>
    <div class="notes-grid">
        {% for n in note %}
        <div class="note-card {% if n.important %}important-note{% endif %}">
            <a href="/note/{{ n._id }}" class="note-link">
                <h2>{{ n.title }}</h2>
            </a>
            <form action="/delete/{{ n._id }}" method="post" class="delete-form">
                <button type="submit" class="btn delete-btn">Delete</button>
            </form>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
